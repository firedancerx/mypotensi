      const preload=new Image();
      preload.onload=()=>{
        slideImg.src=data.img;
        slideImg.alt="";
        requestAnimationFrame(()=>slideImg.classList.remove("is-changing"));
      };
      preload.onerror=()=>slideImg.classList.remove("is-changing");
      preload.src=data.img;

      slideBadge.textContent=data.badge;
      slideTitle.textContent=data.title;
      slideKey.textContent=data.key;
      bulletsList.replaceChildren(...data.bullets.map(b=>{
        const li=document.createElement("li");
        li.textContent=b;
        return li;
      }));

      [...dotsWrap.children].forEach((dot,i)=>{
        dot.classList.toggle("active",i===index);
        dot.setAttribute("aria-current",i===index?"true":"false");
      });

      if(pushHash) history.replaceState(null,"","#slide-"+(index+1));
      preloadAdjacent(index);
    }

    function goTo(index){
      currentIndex=(index+slidesData.length)%slidesData.length;
      renderSlide(currentIndex);
    }
    function prevSlide(reset=true){goTo(currentIndex-1);if(reset) resetAutoAdvance()}
    function nextSlide(reset=true){goTo(currentIndex+1);if(reset) resetAutoAdvance()}

    slidesData.forEach((_,i)=>{
      const dot=document.createElement("button");
      dot.type="button";
      dot.className="dot"+(i===0?" active":"");
      dot.setAttribute("aria-label","Pergi ke slaid "+(i+1));
      dot.setAttribute("aria-current",i===0?"true":"false");
      dot.addEventListener("click",()=>{goTo(i);resetAutoAdvance();});
      dotsWrap.appendChild(dot);
    });

    document.getElementById("prevBtn").addEventListener("click",prevSlide);
    document.getElementById("nextBtn").addEventListener("click",nextSlide);

    document.addEventListener("keydown",e=>{
      if(e.key==="ArrowLeft") prevSlide();
      if(e.key==="ArrowRight") nextSlide();
      if(e.key==="Escape") setMenu(false);
    });

    slider.addEventListener("touchstart",e=>{
      touchStartX=e.changedTouches[0].clientX;
    },{passive:true});
    slider.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-touchStartX;
      if(Math.abs(dx)>45) dx<0?nextSlide():prevSlide();
    },{passive:true});

    function setMenu(open){
      menuPanel.classList.toggle("open",open);
      menuPanel.setAttribute("aria-hidden",String(!open));
      menuOpen.setAttribute("aria-expanded",String(open));
    }
    menuOpen.addEventListener("click",()=>setMenu(true));
    menuClose.addEventListener("click",()=>setMenu(false));
    menuPanel.addEventListener("click",e=>{
      const a=e.target.closest("[data-slide]");
      if(a){
        e.preventDefault();
        goTo(Number(a.dataset.slide));
        resetAutoAdvance();
        setMenu(false);
      } else if(e.target===menuPanel){
        setMenu(false);
      }
    });

    const match=location.hash.match(/^#slide-(\d+)$/);
    if(match){
      const n=Number(match[1]);
      if(n>=1&&n<=slidesData.length) currentIndex=n-1;
    }
    document.addEventListener("visibilitychange",()=>{
      if(document.hidden){clearInterval(autoTimer);}else{startAutoAdvance();}
    });
    renderSlide(currentIndex,false);
    startAutoAdvance();
  </script>
</body>
</html>
